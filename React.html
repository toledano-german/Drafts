<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Drag and Drop - Component Style</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f4f4;
      color: #222;
    }

    h1, h2 {
      margin-top: 0;
    }

    .container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .panel {
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 16px;
      width: 320px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }

    .item {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: grab;
      user-select: none;
    }

    .item:active {
      cursor: grabbing;
    }

    .red { background: #e74c3c; }
    .blue { background: #3498db; }
    .green { background: #27ae60; }
    .purple { background: #8e44ad; }

    .drop-zone {
      min-height: 180px;
      border: 3px dashed #aaa;
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
      transition: 0.2s;
    }

    .drop-zone.over {
      border-color: #3498db;
      background: #eef7ff;
    }

    .placeholder {
      color: #666;
    }

    .dropped-item {
      background: #ececec;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ddd;
    }

    .toolbar {
      margin-top: 16px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .log {
      margin-top: 24px;
      background: #111;
      color: #0f0;
      padding: 12px;
      border-radius: 8px;
      min-height: 120px;
      white-space: pre-wrap;
      font-family: monospace;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    function DragItem({ item, onDragStart }) {
      return (
        <div
          className={"item " + item.className}
          draggable={true}
          onDragStart={(event) => onDragStart(event, item)}
        >
          {item.label}
        </div>
      );
    }

    function SourcePanel({ items, onDragStart }) {
      return (
        <div className="panel">
          <h2>Draggable Items</h2>
          {items.map(item => (
            <DragItem
              key={item.id}
              item={item}
              onDragStart={onDragStart}
            />
          ))}
        </div>
      );
    }

    function DropZone({
      droppedItems,
      isOver,
      onDragOver,
      onDragLeave,
      onDrop
    }) {
      return (
        <div className="panel">
          <h2>Drop Zone</h2>

          <div
            className={"drop-zone" + (isOver ? " over" : "")}
            onDragOver={onDragOver}
            onDragLeave={onDragLeave}
            onDrop={onDrop}
          >
            {droppedItems.length === 0 ? (
              <div className="placeholder">Drop items here...</div>
            ) : (
              droppedItems.map((item, index) => (
                <div key={index} className="dropped-item">
                  {item.label}
                </div>
              ))
            )}
          </div>

          <div style={{ marginTop: "12px" }}>
            Dropped count: <strong>{droppedItems.length}</strong>
          </div>
        </div>
      );
    }

    function EventLog({ lines }) {
      return (
        <div className="log">
          {lines.join("\\n")}
        </div>
      );
    }

    function App() {
      const [droppedItems, setDroppedItems] = React.useState([]);
      const [isOver, setIsOver] = React.useState(false);
      const [logLines, setLogLines] = React.useState(["Event log:"]);

      const items = [
        { id: 1, label: "Red Box", className: "red" },
        { id: 2, label: "Blue Box", className: "blue" },
        { id: 3, label: "Green Box", className: "green" },
        { id: 4, label: "Purple Box", className: "purple" }
      ];

      function addLog(message) {
        setLogLines(prev => [...prev, message]);
      }

      function handleDragStart(event, item) {
        event.dataTransfer.setData("text/plain", JSON.stringify(item));
        addLog("dragstart -> " + item.label);
      }

      function handleDragOver(event) {
        event.preventDefault();
        if (!isOver) {
          setIsOver(true);
          addLog("dragover");
        }
      }

      function handleDragLeave() {
        setIsOver(false);
        addLog("dragleave");
      }

      function handleDrop(event) {
        event.preventDefault();
        setIsOver(false);

        const raw = event.dataTransfer.getData("text/plain");
        if (!raw) {
          addLog("drop -> no data");
          return;
        }

        const item = JSON.parse(raw);
        setDroppedItems(prev => [...prev, item]);
        addLog("drop -> " + item.label);
      }

      function clearDropZone() {
        setDroppedItems([]);
        setIsOver(false);
        setLogLines(["Event log:", "clear"]);
      }

      return (
        <div>
          <h1>React Drag and Drop Demo</h1>
          <p>
            Drag an item from the left component and drop it into the right component.
          </p>

          <div className="container">
            <SourcePanel
              items={items}
              onDragStart={handleDragStart}
            />

            <DropZone
              droppedItems={droppedItems}
              isOver={isOver}
              onDragOver={handleDragOver}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop}
            />
          </div>

          <div className="toolbar">
            <button onClick={clearDropZone}>Clear</button>
          </div>

          <EventLog lines={logLines} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
